name: Configurar Supabase

# Publica as funções e roda os scripts do banco no projeto Supabase.
# Roda sozinho quando algo muda em supabase/, e também pelo botão "Run workflow".
# Segredos do repositório (Settings › Secrets and variables › Actions):
#   SUPABASE_ACCESS_TOKEN  token de acesso da conta Supabase (obrigatório)
#   CRON_SECRET            senha da busca automática nos tribunais (obrigatório para o agendamento)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: lihwcjlstpgdqyvdkmjd
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN (Settings › Secrets and variables › Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Banco de dados (tabelas, regras de acesso e agenda)
        run: |
          run_sql() {
            jq -Rs '{query: .}' "$1" > /tmp/body.json
            status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json)
            if [ "$status" -ge 300 ]; then echo "::error::$1 falhou ($status)"; cat /tmp/resp.json; exit 1; fi
            echo "$1: ok"
          }
          run_sql supabase/schema.sql
          run_sql supabase/agenda.sql

      - name: Funções (tribunais e agenda)
        run: |
          supabase functions deploy tribunais --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy agenda --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Busca automática nos tribunais (CRON_SECRET)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Sem o segredo CRON_SECRET: a busca automática diária não foi configurada (o botão Buscar agora funciona)."
            exit 0
          fi
          supabase secrets set CRON_SECRET="$CRON_SECRET" --project-ref "$PROJECT_REF"
          # Troca o marcador pelo segredo só no arquivo temporário (o segredo não aparece no log nem no repositório).
          sed "s|COLE_AQUI_O_SEGREDO|$CRON_SECRET|" supabase/tribunais.sql > /tmp/tribunais.sql
          jq -Rs '{query: .}' /tmp/tribunais.sql > /tmp/body.json
          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          rm -f /tmp/tribunais.sql /tmp/body.json
          if [ "$status" -ge 300 ]; then echo "::error::tribunais.sql falhou ($status)"; cat /tmp/resp.json; exit 1; fi
          echo "Agendamento diário configurado."
