name: Configurar Supabase

# Publica as funções e roda os scripts do banco no projeto Supabase.
# Roda sozinho quando algo muda em supabase/, e também pelo botão "Run workflow".
# Segredos do repositório (Settings › Secrets and variables › Actions):
#   SUPABASE_ACCESS_TOKEN  token de acesso da conta Supabase (obrigatório)
#   CRON_SECRET            senha da busca automática nos tribunais (obrigatório para o agendamento)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: lihwcjlstpgdqyvdkmjd
  # Endereço do sistema e endereços aceitos nos links de login (confirmação de e-mail e nova senha).
  SITE_URL: https://escritorio.fernandooliveiraadvogado.com.br/
  REDIRECT_URLS: https://escritorio.fernandooliveiraadvogado.com.br/,https://fernandooliveira12091-boop.github.io/escritorio-digita/
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          # Só o formato (nunca o valor): ajuda a achar segredo trocado ou colado com espaço.
          t="$SUPABASE_ACCESS_TOKEN"
          case "$t" in
            sbp_*) echo "SUPABASE_ACCESS_TOKEN: formato de token do Supabase (sbp_…), ${#t} caracteres." ;;
            sk-ant-*) echo "::error::SUPABASE_ACCESS_TOKEN contém uma chave da Anthropic (sk-ant-…), não um token do Supabase."; exit 1 ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN não começa com sbp_ (${#t} caracteres). Gere em supabase.com/dashboard/account/tokens."; exit 1 ;;
          esac
          if [ "$t" != "$(printf '%s' "$t" | tr -d '[:space:]')" ]; then echo "::error::SUPABASE_ACCESS_TOKEN tem espaço ou quebra de linha: cole de novo só o token."; exit 1; fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $t" https://api.supabase.com/v1/projects)
          if [ "$status" != "200" ]; then echo "::error::O Supabase recusou o SUPABASE_ACCESS_TOKEN (HTTP $status): token apagado, expirado ou de outra conta. Gere outro e atualize o segredo."; exit 1; fi
          echo "SUPABASE_ACCESS_TOKEN aceito pelo Supabase."

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Banco de dados (tabelas, regras de acesso e agenda)
        run: |
          run_sql() {
            jq -Rs '{query: .}' "$1" > /tmp/body.json
            status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json)
            if [ "$status" -ge 300 ]; then echo "::error::$1 falhou ($status)"; cat /tmp/resp.json; exit 1; fi
            echo "$1: ok"
          }
          run_sql supabase/schema.sql
          run_sql supabase/agenda.sql

      - name: Endereços do login (Site URL e Redirect URLs)
        run: |
          jq -n --arg site "$SITE_URL" --arg urls "$REDIRECT_URLS" '{site_url: $site, uri_allow_list: $urls}' > /tmp/auth.json
          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/auth.json)
          if [ "$status" -ge 300 ]; then echo "::error::Configuração do login falhou ($status)"; cat /tmp/resp.json; exit 1; fi
          echo "Site URL: $SITE_URL"

      - name: Funções (tribunais, agenda e whatsapp)
        run: |
          supabase functions deploy tribunais --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy agenda --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy whatsapp --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Chaves do agente de IA no WhatsApp
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_WORKSPACE_ID: ${{ secrets.WHATSAPP_WORKSPACE_ID }}
        run: |
          # Copia para o Supabase só as chaves que existirem nos segredos do GitHub (os valores não aparecem no log).
          args=()
          for k in ANTHROPIC_API_KEY WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET WHATSAPP_VERIFY_TOKEN WHATSAPP_WORKSPACE_ID; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); echo "$k: configurada"; else echo "$k: ainda não cadastrada no GitHub"; fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"; fi

      - name: Busca automática nos tribunais (CRON_SECRET)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Sem o segredo CRON_SECRET: a busca automática diária não foi configurada (o botão Buscar agora funciona)."
            exit 0
          fi
          supabase secrets set CRON_SECRET="$CRON_SECRET" --project-ref "$PROJECT_REF"
          # Troca o marcador pelo segredo só no arquivo temporário (o segredo não aparece no log nem no repositório).
          sed "s|COLE_AQUI_O_SEGREDO|$CRON_SECRET|" supabase/tribunais.sql > /tmp/tribunais.sql
          jq -Rs '{query: .}' /tmp/tribunais.sql > /tmp/body.json
          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          rm -f /tmp/tribunais.sql /tmp/body.json
          if [ "$status" -ge 300 ]; then echo "::error::tribunais.sql falhou ($status)"; cat /tmp/resp.json; exit 1; fi
          echo "Agendamento diário configurado."
